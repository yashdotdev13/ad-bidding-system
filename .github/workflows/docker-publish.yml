name: Build and Push Microservices

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Auction Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./auction-service/Dockerfile
          push: true
          tags: |
            oyank/auction-service:latest
            oyank/auction-service:${{ github.sha }}

      - name: Build and Push Bidder Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./bidder-service/Dockerfile
          push: true
          tags: |
            oyank/bidder-service:latest
            oyank/bidder-service:${{ github.sha }}

      - name: Build and Push Campaign Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./campaign-service/Dockerfile
          push: true
          tags: |
            oyank/campaign-service:latest
            oyank/campaign-service:${{ github.sha }}